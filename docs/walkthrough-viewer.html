<style>
:root{

}
@media (prefers-color-scheme:dark){:root{
  --paper:#121212;--panel:#1c1c1c;--ink:#f4f4f4;--muted:#b0b7c0;--faint:#7d8590;--line:#333a42;
  --accent:#78a9ff;--accent-soft:#0f2a5c;

  --inferred:#f1c21b;--inferred-soft:#3a2f05;--unverified:#c6c6c6;--unverified-soft:#2c2c2c;

}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans)}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.9em;background:var(--paper);padding:1px 4px;border-radius:3px}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--faint)}
button:focus-visible,.rt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{padding:20px 28px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.repo{font-size:13px;color:var(--muted)}
h1{font-size:20px;font-weight:600;margin:4px 0 6px;max-width:80ch}
.stats{font-size:13px;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 28px;margin-top:12px;font-size:14px;max-width:1100px}
.summary b{font-weight:500;display:block;color:var(--muted);font-size:12px}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;min-height:calc(100vh - 150px)}
aside{border-right:1px solid var(--line);padding:16px 10px;background:var(--panel)}
aside .cap{font-size:12px;color:var(--muted);padding:0 8px 8px}
.rt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--muted);position:relative}
.rt:hover{background:var(--paper)}
.rt.on{background:var(--accent-soft);color:var(--ink)}
.rt .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;background:var(--panel)}
.rt.on .n{border-color:var(--accent);color:var(--accent)}
.rt.dead .l{text-decoration:line-through}
.rt .file{display:block;font-family:var(--mono);font-size:11px;color:var(--faint)}
main{padding:18px 28px 40px;min-width:0}
.graph{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.graph svg{display:block;margin:0 auto}
.step{margin-top:18px;max-width:980px}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.shead h2{font-size:19px;font-weight:600;margin:0}
.kind{font-size:12px;color:var(--muted)}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.t-fact{background:var(--fact-soft);color:var(--fact)}.t-commit_history{background:var(--commit-soft);color:var(--commit)}
.t-inferred{background:var(--inferred-soft);color:var(--inferred)}.t-unverified{background:var(--unverified-soft);color:var(--unverified)}
.voice{display:flex;gap:14px;align-items:flex-start;margin:14px 0 6px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
.voice p{margin:0;font:16.5px/1.65 var(--serif);max-width:75ch}
.play{flex:none;width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center}
.beat{margin-top:18px}
.beat h3{font-size:14px;font-weight:600;margin:0 0 4px;display:flex;gap:8px;align-items:center}
.beat h3 .bn{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px}
.beat p{margin:4px 0 8px;max-width:78ch}
.code{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:8px 0;overflow:hidden}
.code.rec{border-style:dashed}
.code .fh{display:flex;justify-content:space-between;gap:10px;font:12px var(--mono);color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
.code .body{overflow-x:auto;padding:4px 0}
.ln{font:12.5px/1.7 var(--mono);white-space:pre;padding:0 12px 0 0;display:flex}
.ln .g{flex:none;width:22px;text-align:center;color:var(--faint);user-select:none}
.ln.added{background:var(--add)}.ln.removed{background:var(--del);color:var(--muted)}.ln.removed .tx{text-decoration:line-through}
.ln.focus{background:var(--focus)}.ln.elided{color:var(--faint);font-style:italic}
.ann{display:flex;gap:8px;align-items:baseline;font:13px/1.5 var(--sans);color:var(--accent);padding:2px 12px 6px 34px;white-space:normal}
.ann .chip{font-size:11px}
.traces{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.trace{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:12.5px var(--mono)}
.trace span{padding:3px 8px;border-radius:5px;background:var(--panel);border:1px solid var(--line)}
.trace span.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.trace span.ok{background:var(--fact-soft);color:var(--fact);border-color:transparent}
.trace i{color:var(--faint);font-style:normal}
.notes{font-size:13px;color:var(--muted);margin-top:10px;max-width:78ch}
.notes div{margin:3px 0}
.q{margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:78ch}
.q b{font-weight:600;font-size:13px}
.q p{margin:4px 0 0;font-size:14px}
.q small{color:var(--muted)}
.src{font-size:12px;color:var(--faint);margin-top:10px}
.nav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.nav .hint{font-size:12px;color:var(--faint)}
.lower{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:30px;max-width:980px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h4{margin:0 0 8px;font-size:14px;font-weight:600}
.hk{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--line)}
.hk:last-child{border-bottom:0}
.hk .f{font-family:var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hk .s{flex:none}
.warn{color:var(--danger)}
@media (max-width:800px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const S=D.steps;let i=0;
const TAG={fact:'Fact',commit_history:'From commits',inferred:'Inferred',unverified:'Not verified'};
const KIND={symptom:'Symptom',cause:'Cause',constraint:'Constraint',data_origin:'Where the data lives',decision:'Key decision',change:'Change',alternative_rejected:'Rejected alternative',dead_end:'Dead end',open_question:'Open question',verification:'Verification'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const chip=t=>'<span class="chip t-'+t+'">'+TAG[t]+'</span>';
const nodeById=Object.fromEntries(D.graph.nodes.map(n=>[n.id,n]));

document.getElementById('repo').innerHTML='<a href="'+esc(D.pr.url)+'">'+esc(D.pr.repo)+' #'+D.pr.number+'</a> by '+esc(D.pr.author);
document.getElementById('title').textContent=D.pr.title;
document.getElementById('stats').textContent=D.pr.filesChanged+' files changed, +'+D.pr.additions+' −'+D.pr.deletions+', '+D.pr.commitTitles.length+' commits';
document.getElementById('summary').innerHTML='<div><b>What was broken</b>'+md(D.summary.problem)+'</div><div><b>The idea of the fix</b>'+md(D.summary.solution)+'</div>';

const route=document.getElementById('route');
route.innerHTML=S.map((s,j)=>{const n=nodeById[s.focusNode];return '<div class="rt'+(s.isDeadEnd?' dead':'')+'" tabindex="0" data-j="'+j+'"><span class="n">'+(j+1)+'</span><span><span class="l">'+esc(s.routeLabel)+'</span><span class="file">'+esc(n?n.label:'')+'</span></span></div>'}).join('');
route.querySelectorAll('.rt').forEach(el=>{el.onclick=()=>go(+el.dataset.j);el.onkeydown=e=>{if(e.key==='Enter')go(+el.dataset.j)}});

const NW=200,NH=54,CG=110,RG=46,P=28,PX=150;
const cols=Math.max(...D.graph.nodes.map(n=>n.layout.col))+1,rows=Math.max(...D.graph.nodes.map(n=>n.layout.row))+1;
const W=PX*2+cols*NW+(cols-1)*CG,Hh=P*2+rows*NH+(rows-1)*RG;
const pos=n=>({x:PX+n.layout.col*(NW+CG),y:P+n.layout.row*(NH+RG)});
const ctr=n=>{const p=pos(n);return {x:p.x+NW/2,y:p.y+NH/2}};
function clip(a,b){const dx=b.x-a.x,dy=b.y-a.y;const t=Math.min(dx?(NW/2)/Math.abs(dx):1e9,dy?(NH/2)/Math.abs(dy):1e9);return {x:a.x+dx*t,y:a.y+dy*t}}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function drawGraph(){
  const step=i+1,svg=document.getElementById('g');
  svg.setAttribute('viewBox','0 0 '+W+' '+Hh);svg.setAttribute('width',W);
  const c={ink:css('--ink'),muted:css('--muted'),faint:css('--faint'),line:css('--line'),acc:css('--accent'),accs:css('--accent-soft'),dan:css('--danger'),panel:css('--panel')};
  let h='<defs>'+['acc','dan','faint'].map(k=>'<marker id="m-'+k+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="'+c[k]+'"/></marker>').join('')+'</defs>';
  D.graph.edges.forEach(e=>{
    if((e.visibleFrom&&step<e.visibleFrom)||(e.visibleUntil&&step>e.visibleUntil))return;
    const A=ctr(nodeById[e.from]),B=ctr(nodeById[e.to]),a=clip(A,B),b=clip(B,A);
    const col=e.problem?c.dan:e.state==='after'?c.acc:c.faint,mk=e.problem?'dan':e.state==='after'?'acc':'faint';
    const dash=e.problem||e.state==='before'?' stroke-dasharray="6 4"':'';
    h+='<path d="M'+a.x+' '+a.y+' L'+b.x+' '+b.y+'" stroke="'+col+'" stroke-width="1.6" fill="none"'+dash+' marker-end="url(#m-'+mk+')"/>';
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,vert=Math.abs(a.x-b.x)<2;
    if(e.label)h+='<text x="'+(vert?mx+8:mx)+'" y="'+(vert?my+4:my-7)+'" font-size="12" font-family="IBM Plex Mono, monospace" fill="'+col+'" text-anchor="'+(vert?'start':'middle')+'">'+esc(e.label)+'</text>';
  });
  const visited=new Set(S.slice(0,i).map(s=>s.focusNode)),cur=S[i].focusNode;
  D.graph.nodes.forEach(n=>{
    if(n.visibleFrom&&step<n.visibleFrom)return;
    const p=pos(n),on=n.id===cur,was=visited.has(n.id);
    h+='<g><rect x="'+p.x+'" y="'+p.y+'" width="'+NW+'" height="'+NH+'" rx="7" fill="'+(on?c.accs:c.panel)+'" stroke="'+(on?c.acc:was?c.muted:c.line)+'" stroke-width="'+(on?2:1)+'"/>';
    h+='<text x="'+(p.x+NW/2)+'" y="'+(p.y+23)+'" text-anchor="middle" font-size="14" font-weight="500" font-family="IBM Plex Sans, sans-serif" fill="'+c.ink+'">'+esc(n.label)+'</text>';
    if(n.sublabel)h+='<text x="'+(p.x+NW/2)+'" y="'+(p.y+41)+'" text-anchor="middle" font-size="12" font-family="IBM Plex Sans, sans-serif" fill="'+c.muted+'">'+esc(n.sublabel)+'</text>';
    h+='</g>';
  });
  if(i>0&&S[i-1].focusNode!==cur){
    const A=ctr(nodeById[S[i-1].focusNode]),B=ctr(nodeById[cur]),a=clip(A,B),b=clip(B,A);
    const mx=(a.x+b.x)/2+(b.y-a.y)*0.45,my=(a.y+b.y)/2-(b.x-a.x)*0.45;
    h+='<path d="M'+a.x+' '+a.y+' Q'+mx+' '+my+' '+b.x+' '+b.y+'" stroke="'+(S[i].isDeadEnd?c.dan:c.acc)+'" stroke-width="2.4" fill="none" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#m-'+(S[i].isDeadEnd?'dan':'acc')+')"/>';
  }
  svg.innerHTML=h;
}
function codeBlock(b){
  const rev={base:'before',head:'after',diff:'change'}[b.revision]||b.revision;
  let h='<div class="code'+(b.reconstructed?' rec':'')+'"><div class="fh"><span>'+esc(b.file)+'</span><span>'+esc(b.label||rev)+'</span></div><div class="body">';
  b.lines.forEach(l=>{
    const g={added:'+',removed:'−',focus:'›',elided:'',context:''}[l.kind];
    h+='<div class="ln '+l.kind+'"><span class="g">'+g+'</span><span class="tx">'+esc(l.text||' ')+'</span></div>';
    if(l.annotation)h+='<div class="ann"><span>↳ '+md(l.annotation)+'</span>'+(l.annotationTag&&l.annotationTag!=='fact'?chip(l.annotationTag):'')+'</div>';
  });
  return h+'</div></div>';
}
function traces(ts){return '<div class="traces">'+ts.map(t=>'<div class="trace">'+t.map((x,j)=>(j?'<i>→</i>':'')+'<span class="'+(x.status||'')+'">'+esc(x.label)+'</span>').join('')+'</div>').join('')+'</div>'}
function render(){
  const s=S[i];
  let h='<div class="shead"><h2>'+(i+1)+'. '+esc(s.title)+'</h2>'+chip(s.tag)+'<span class="kind">'+KIND[s.kind]+'</span></div>';
  h+='<div class="voice"><button class="play" id="play" aria-label="Read this step aloud">▶</button><p>'+esc(s.narration)+'</p></div>';
  s.beats.forEach((b,k)=>{h+='<div class="beat"><h3><span class="bn">'+(k+1)+'</span>'+esc(b.heading)+'</h3><p>'+md(b.text)+'</p>';(b.code||[]).forEach(c=>h+=codeBlock(c));if(b.traces)h+=traces(b.traces);h+='</div>'});
  const notes=(s.notes||[]).map(n=>'<div>'+md(n)+'</div>').concat((s.skipped||[]).map(n=>'<div>Skipped: '+md(n)+'</div>'));
  if(notes.length)h+='<div class="notes">'+notes.join('')+'</div>';
  D.openQuestions.filter(q=>q.stepId===s.id).forEach(q=>h+='<div class="q"><b>Ask the author</b> '+chip(q.tag)+'<p>'+md(q.question)+'</p><small>'+md(q.why)+'</small></div>');
  h+='<div class="src">Sources: '+s.sources.map(x=>esc(x.type.replace('_',' '))+' — '+esc(x.ref)).join('; ')+'</div>';
  document.getElementById('step').innerHTML=h;
  document.getElementById('play').onclick=()=>speak(false);
  route.querySelectorAll('.rt').forEach((el,j)=>el.classList.toggle('on',j===i));
  drawGraph();
}
function go(j){if(j<0||j>=S.length)return;speechSynthesis.cancel();i=j;render();if(document.getElementById('auto').checked)speak(true)}
function speak(chain){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(S[i].narration);
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith(D.meta.language||'en'));if(v)u.voice=v;
  u.rate=1.02;
  u.onend=()=>{if((chain||document.getElementById('auto').checked)&&i<S.length-1)setTimeout(()=>go(i+1),700)};
  speechSynthesis.speak(u);
}
document.getElementById('prev').onclick=()=>go(i-1);
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('auto').onchange=e=>{if(e.target.checked)speak(true);else speechSynthesis.cancel()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.getElementById('questions').innerHTML=D.openQuestions.length?D.openQuestions.map(q=>'<div class="q" style="margin-top:0;margin-bottom:8px"><p>'+md(q.question)+'</p><small>Step '+(S.findIndex(s=>s.id===q.stepId)+1)+' · '+md(q.why)+'</small></div>').join(''):'<p style="color:var(--muted);font-size:14px">No open questions.</p>';
const ref={};S.forEach((s,j)=>s.hunkIds.forEach(h=>(ref[h]=ref[h]||[]).push(j+1)));
const sk=Object.fromEntries(D.skippedHunks.map(x=>[x.hunkId,x.reason]));
let unc=0;
document.getElementById('coverage').innerHTML=D.hunks.map(h=>{const st=ref[h.id]?'steps '+ref[h.id].join(', '):sk[h.id]?'skipped: '+esc(sk[h.id]):(unc++,'<span class="warn">not explained</span>');return '<div class="hk"><span class="f" title="'+esc(h.id)+'">'+esc(h.id.split('/').pop())+'</span><span class="s">'+st+'</span></div>'}).join('');
document.getElementById('covh').textContent='Diff coverage: '+(D.hunks.length-unc)+' of '+D.hunks.length+' hunks accounted for';
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
render();
</script>
</body>
</html>
